name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare local configuration
        run: cp include/config.example.h include/config.h
      - name: Build ESP32-C3 firmware
        uses: platformio/platformio-core-action@v1
        with:
          command: run -e esp32c3
