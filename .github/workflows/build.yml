name: Build firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Prepare local configuration
        run: cp include/config.example.h include/config.h
      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio
      - name: Build ESP32-C3 firmware
        run: pio run -e esp32c3
